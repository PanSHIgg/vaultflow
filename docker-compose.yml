name: vaultflow

# VaultFlow dev orchestration — Wave-2 I1 全栈装配.
#
# 一键拉起顺序 (契约: scripts/deploy-and-seed.sh 先行生成全部制品):
#   bash scripts/deploy-and-seed.sh   # 合约部署 + signer-config + certs + env + 镜像
#   docker compose up --build -d      # 全部服务健康
#   curl -sf localhost:8080/healthz
#
# anvil-a/anvil-b 使用本地构建镜像 vaultflow-anvil:local
# (ghcr.io/foundry-rs/foundry 在本环境不可拉取 — deploy 目录由脚本生成,
# 内含从 WSL foundry 工具链拷贝的 anvil/cast 二进制 + Dockerfile.anvil).

services:
  postgres:
    image: postgres:16-alpine
    container_name: vaultflow-postgres
    environment:
      POSTGRES_USER: vaultflow
      POSTGRES_PASSWORD: vaultflow
      POSTGRES_DB: vaultflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultflow -d vaultflow"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: vaultflow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  vault-signer: # Rust mTLS gRPC 签名金库 (进程级隔离)
    # 官方多阶段构建路径: services/vault-signer/Dockerfile (context=repo root).
    # 本环境 buildkit 内 cargo registry 拉取不可靠 — deploy-and-seed.sh 在 WSL
    # 侧 cargo build --release 后生成 deploy/Dockerfile.signer 打包预编译二进制.
    build:
      context: deploy
      dockerfile: Dockerfile.signer
    image: vaultflow-signer:local
    container_name: vaultflow-signer
    environment:
      VAULT_SIGNER_CONFIG: /etc/vaultflow/signer-config.json
      RUST_LOG: info
    volumes:
      - ./certs:/etc/vaultflow/certs:ro                    # scripts/gen-mtls-certs.sh
      - ./deploy/signer-config.json:/etc/vaultflow/signer-config.json:ro
      - ./deploy/signer-data:/var/lib/vault-signer          # sqlite + kek (0600)
    expose:
      - "50051" # 仅内网 mTLS, 不对外发布
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/50051'"]
      interval: 5s
      timeout: 4s
      retries: 15
    restart: unless-stopped

  gateway: # 对外 HTTP API (auth/assets/me/admin) — 唯一暴露端口的服务
    build:
      context: services/gateway-core
      dockerfile: Dockerfile
    image: vaultflow-gateway:local
    container_name: vaultflow-gateway
    entrypoint: ["/app/gateway"]
    env_file:
      # deploy-and-seed.sh 生成 (含 CHAIN_CONFIG_JSON); required:false 允许
      # 脚本早期 `compose up postgres anvil-*` 时该文件尚未就绪.
      - path: deploy/gateway.env
        required: false
    environment:
      DATABASE_URL: postgres://vaultflow:vaultflow@postgres:5432/vaultflow?sslmode=disable
      REDIS_URL: redis://redis:6379
      SIGNER_ADDR: vault-signer:50051
      SIGNER_ID: vault-signer
      MTLS_CLIENT_CERT: /etc/vaultflow/certs/clients/gateway-core.crt
      MTLS_CLIENT_KEY: /etc/vaultflow/certs/clients/gateway-core.key
      MTLS_CA_CERT: /etc/vaultflow/certs/ca/ca.crt
      MTLS_SERVER_NAME: vault-signer
      MIGRATIONS_DIR: /app/migrations
      PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - ./certs:/etc/vaultflow/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e \"GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && grep -q \"\\\"ok\\\"\" <&3'"]
      interval: 5s
      timeout: 4s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault-signer:
        condition: service_healthy
    restart: unless-stopped

  backend: # 业务核心 worker: txmanager + 每链 sweeper + 充值入账协程
    image: vaultflow-gateway:local
    container_name: vaultflow-backend
    entrypoint: ["/app/backend"]
    env_file:
      - path: deploy/gateway.env
        required: false
    environment:
      DATABASE_URL: postgres://vaultflow:vaultflow@postgres:5432/vaultflow?sslmode=disable
      REDIS_URL: redis://redis:6379
      SIGNER_ADDR: vault-signer:50051
      SIGNER_ID: vault-signer
      ANCHOR_CHAIN_ID: "11155111"
      MTLS_CLIENT_CERT: /etc/vaultflow/certs/clients/gateway-core.crt
      MTLS_CLIENT_KEY: /etc/vaultflow/certs/clients/gateway-core.key
      MTLS_CA_CERT: /etc/vaultflow/certs/ca/ca.crt
      MTLS_SERVER_NAME: vault-signer
      PORT: "8081"
    expose:
      - "8081"
    volumes:
      - ./certs:/etc/vaultflow/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081 && echo -e \"GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && grep -q \"\\\"ok\\\"\" <&3'"]
      interval: 5s
      timeout: 4s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      vault-signer:
        condition: service_healthy
      gateway:
        condition: service_healthy  # gateway 先跑迁移, backend 再等 schema
    restart: unless-stopped

  indexer: # 独立扫链进程: Transfer 事件 -> onchain_deposits -> FINALIZED
    image: vaultflow-gateway:local
    container_name: vaultflow-indexer
    entrypoint: ["/app/indexer"]
    env_file:
      - path: deploy/gateway.env
        required: false
    environment:
      DATABASE_URL: postgres://vaultflow:vaultflow@postgres:5432/vaultflow?sslmode=disable
      PORT: "8082"
    expose:
      - "8082"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8082 && echo -e \"GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && grep -q \"\\\"ok\\\"\" <&3'"]
      interval: 5s
      timeout: 4s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
