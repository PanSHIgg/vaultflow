[package]
name = "vault-signer"
version = "0.1.0"
edition = "2021"
description = "VaultFlow process-isolated signing vault (mTLS gRPC + zero-trust policy firewall)"
license = "MIT"

# Standalone crate: explicitly NOT a member of any future repo-level workspace.
[workspace]

[dependencies]
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.12", features = ["tls"] }
tonic-reflection = { version = "0.12", optional = true }
prost = "0.13"
prost-types = "0.13"
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
secrecy = "0.8"
zeroize = { version = "1", features = ["derive"] }
aes-gcm = "0.10"
ed25519-dalek = "2"
alloy-primitives = "1" # U256 / Address / B256 / keccak256
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cfg-if = "1"
rand = "0.8" # OsRng — AES-GCM envelope nonces only
# mTLS server stack (must mirror tonic 0.12's feature selection so a single
# rustls CryptoProvider — ring — is present in the build):
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
rustls-pemfile = "2"
tokio-stream = { version = "0.1", features = ["net"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Memory"] }

[dev-dependencies]
rcgen = "0.13"   # in-memory test PKI (CA + mTLS leaves)
tempfile = "3"   # isolated signer DB / cert dirs per test

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"
